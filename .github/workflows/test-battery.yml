name: Test Battery

# RC21: full unit + instrumentation test battery on legacy + modern Android API
# levels. Excludes anything that hits FAL (paid) — the AI upscale tests run with
# an offline-only fixture set and the foreground-service / network paths are
# either mocked at test time or skipped via instrumentation arg.
#
# Runs on push to master/feat/** when app/** or this workflow change.

on:
  push:
    branches: [master, "feat/**"]
    paths:
      - 'app/**'
      - 'benchmark/**'
      - '.github/workflows/test-battery.yml'
  pull_request:
    branches: [master]
    paths:
      - 'app/**'
      - 'benchmark/**'
      - '.github/workflows/test-battery.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # The signing config is shared between debug and release variants
          # (see app/build.gradle.kts), so even instrumentation builds need
          # the keystore present. Falls back to creating an empty placeholder
          # if the secret isn't set — Gradle will fail later, but the early
          # error message is clearer than a missing-file error mid-build.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            touch release.keystore
            echo "WARNING: RELEASE_KEYSTORE_BASE64 not set — signing will fail"
          fi

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Decode the real google-services.json if the secret is set; fall back
          # to a stub for forks / unconfigured branches.
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub",
              "storage_bucket": "stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.posterpdf"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaStubAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  instrumentation-tests:
    name: Instrumentation (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    # RC41: 60min ceiling — cold AVD cache + 8-level matrix means some legs take
    # ~50min when emulator image isn't pre-cached on the runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # RC41: minSdk is 23 (material3:1.5.0-alpha18 manifest); going lower
        # would require dependency rework. The full matrix covers Android 6
        # (Marshmallow) through the live Android 16 preview. Picked levels span:
        #   23  Android 6.0  Marshmallow (minSdk floor)
        #   26  Android 8.0  Oreo (notification channels, foreground services)
        #   28  Android 9    Pie (foldable hinge sensor, slice-as-window)
        #   30  Android 11   R (scoped storage, package visibility)
        #   33  Android 13   Tiramisu (POST_NOTIFICATIONS runtime perm — RC11)
        #   34  Android 14   Upside Down Cake (BG-activity-launch lockdown)
        #   35  Android 15   Vanilla Ice Cream (edge-to-edge default — RC F)
        #   36  Android 16   Baklava (current targetSdk)
        #
        # RC44: matrix size now varies by trigger. With 8 emulator legs at
        # ~5-10% per-leg flake rate (boot timeouts, ADB hangs on GH-hosted
        # runners), the full matrix flunks ~40% of pushes for non-product
        # reasons. So:
        #   - feat/** branch pushes → minimal {23, 33, 36} matrix
        #     (minSdk floor, mid-range Tiramisu, current targetSdk).
        #     Catches >95% of API-level regressions, reduces flake exposure
        #     ~3×, faster wall clock for RC iteration.
        #   - master pushes + PRs to master → full 8-level matrix.
        #     Strong pre-merge gating with comprehensive coverage.
        api-level: ${{ fromJson((github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && '[23, 26, 28, 30, 33, 34, 35, 36]' || '[23, 33, 36]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # The signing config is shared between debug and release variants
          # (see app/build.gradle.kts), so even instrumentation builds need
          # the keystore present. Falls back to creating an empty placeholder
          # if the secret isn't set — Gradle will fail later, but the early
          # error message is clearer than a missing-file error mid-build.
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            touch release.keystore
            echo "WARNING: RELEASE_KEYSTORE_BASE64 not set — signing will fail"
          fi

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub",
              "storage_bucket": "stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.posterpdf"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaStubAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-default-disk4g

      - name: Create AVD + warm cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          # RC22: 4096M internal storage so the APK (now ~115MB after the
          # coin assets landed) has room on the AVD. Default API 23 image
          # ships with ~800MB, which the install-create step rejects with
          # "Requested internal only, but not enough space." Bumping for
          # all API levels keeps the cache key stable.
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD warmed"

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        # rc82: signing credentials required since the plaintext password
        # fallback was removed from app/build.gradle.kts (debug builds sign
        # with the release config, so instrumentation builds need these too).
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          # RC22: 4096M internal storage so the APK (now ~115MB after the
          # coin assets landed) has room on the AVD. Default API 23 image
          # ships with ~800MB, which the install-create step rejects with
          # "Requested internal only, but not enough space." Bumping for
          # all API levels keeps the cache key stable.
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # excludeFAL skips the cloud/FAL SmokeTest cases (assumeFalse); notAnnotation
          # drops @FtlOnly device tests (UpscalePdfDeviceTest's real on-device ML upscale),
          # which can't run on the GPU-less software emulator — those live in ftl-upscale-test.yml.
          script: gradle connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.excludeFAL=true -Pandroid.testInstrumentationRunnerArguments.notAnnotation=com.posterpdf.FtlOnly

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────
  # RC41: Macrobenchmark — startup (cold/warm/hot) + scroll-jank metrics.
  # Runs on a single recent API level (35) since macrobench results don't
  # vary much across OS versions for this kind of UI workload, and
  # spinning up 8 emulator legs of macrobench would be excessive. The
  # numbers are emulator-quality (~10-20% noise) — useful for spotting
  # regressions, not for absolute claims.
  # ───────────────────────────────────────────────────────────────────────
  macrobenchmark:
    name: Macrobenchmark (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # RC44: macrobench is advisory, not gating. Emulator-quality numbers
    # have ~10-20% noise even on a good run; the test exercise also runs
    # into permission-grant flakes on Android 15 emulator (the runner can't
    # always auto-grant runtime perms via `pm grant`). Real
    # regression-tracking happens on physical devices via Firebase Test
    # Lab when we cut a release. Keeping this advisory so an occasional
    # emulator-quirk failure doesn't block RC pushes.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
          else
            touch release.keystore
            echo "WARNING: RELEASE_KEYSTORE_BASE64 not set — signing will fail"
          fi

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
          else
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "stub",
              "storage_bucket": "stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.posterpdf"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaStubAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache (API 36)
        uses: actions/cache@v4
        id: bench-avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: bench-avd-36-default-disk4g

      - name: Create AVD + warm cache
        if: steps.bench-avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD warmed"

      - name: Run macrobenchmark
        uses: reactivecircus/android-emulator-runner@v2
        # rc82: signing credentials — see instrumentation job note.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 36
          arch: x86_64
          target: default
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The :benchmark module's `benchmark` build type targets :app's
          # `benchmark` build type (matchingFallbacks). The Macrobench
          # framework requires a non-debuggable target APK so startup
          # numbers reflect the production code path.
          script: gradle :benchmark:connectedBenchmarkAndroidTest --stacktrace

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-report
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/
            benchmark/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
