name: FTL Macrobenchmark (physical device)

# Runs the Macrobenchmark suite on a REAL device via Firebase Test Lab to
# get meaningful startup/scroll/jank numbers. The local-emulator macrobench
# in test-battery.yml is unreliable for perf (emulator timing) and flakes on
# the benchmark permission grant — FTL physical devices are the right target.
#
# Manual-dispatch only: physical-device minutes consume FTL quota/cost, so we
# don't run this on every push. Trigger from the Actions tab when benchmarks
# are wanted.
#
# Auth: WIF (no long-lived key). Uses the shared `github` pool's
# github-provider (trusts Joeputin100/pdfposter as of 2026-05-28) and the
# gh-actions-ci SA, which already has roles/cloudtestservice.testAdmin +
# storage.objectAdmin on the FTL results bucket.

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'FTL physical device model'
        type: string
        default: 'oriole'
      version:
        description: 'Android API level for the device'
        type: string
        default: '33'

permissions:
  contents: read
  id-token: write   # required for WIF

env:
  GCP_PROJECT: static-webbing-461904-c4
  FTL_BUCKET: ftl-results-static-webbing-461904-c4

jobs:
  ftl-benchmark:
    name: Macrobench on FTL (${{ inputs.device }} API ${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > release.keystore

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | base64 -d > app/google-services.json
          python3 -c 'import json; json.load(open("app/google-services.json"))' && echo "google-services.json: valid JSON"

      - name: Build benchmark APK + benchmark androidTest APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # :app:assembleBenchmark = non-debuggable, profileable target app.
        # :benchmark is a com.android.test module — the module IS the test
        # APK, so :benchmark:assembleBenchmark produces it (there is no
        # separate androidTest task).
        run: gradle :app:assembleBenchmark :benchmark:assembleBenchmark --stacktrace

      - name: Locate APKs
        id: apks
        run: |
          APP_APK=$(find app/build/outputs/apk/benchmark -name "*.apk" | head -1)
          # com.android.test module output — the benchmark-variant APK is the test APK.
          TEST_APK=$(find benchmark/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APP_APK" ] || [ -z "$TEST_APK" ]; then
            echo "Missing APK — app='$APP_APK' test='$TEST_APK'"; exit 1
          fi
          echo "app_apk=$APP_APK" >> "$GITHUB_OUTPUT"
          echo "test_apk=$TEST_APK" >> "$GITHUB_OUTPUT"
          echo "App: $APP_APK"; echo "Test: $TEST_APK"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Macrobenchmark on Firebase Test Lab
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
        # Macrobenchmark-on-FTL recipe: the library writes its JSON results to
        # additionalTestOutputDir on the device; we pull /sdcard/Download and
        # FTL also archives everything to the results bucket. no-isolated-storage
        # lets the benchmark write outside scoped storage on these API levels.
        run: |
          set -e
          gcloud firebase test android run \
            --type=instrumentation \
            --app="${{ steps.apks.outputs.app_apk }}" \
            --test="${{ steps.apks.outputs.test_apk }}" \
            --device="model=${DEVICE},version=${VERSION},locale=en,orientation=portrait" \
            --timeout=20m \
            --environment-variables="additionalTestOutputDir=/sdcard/Download,no-isolated-storage=true" \
            --directories-to-pull=/sdcard/Download \
            --results-bucket="${FTL_BUCKET}" \
            --results-dir="macrobench-${{ github.run_id }}" \
            --project="${GCP_PROJECT}" 2>&1 | tee /tmp/ftl.txt

      - name: Pull benchmark JSON from results bucket
        if: always()
        run: |
          mkdir -p /tmp/bench
          gsutil -m cp -r "gs://${FTL_BUCKET}/macrobench-${{ github.run_id }}/**/artifacts/sdcard/Download/*.json" /tmp/bench/ 2>/dev/null || \
            echo "No JSON pulled — inspect the FTL results dir manually (see log above)."
          ls -la /tmp/bench/ || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftl-macrobench-results
          path: |
            /tmp/bench/
            /tmp/ftl.txt
          retention-days: 30
          if-no-files-found: warn
