name: FTL UX screenshots (odd form factor)

# RC77: capture per-screen UI screenshots on a REAL device via Firebase Test
# Lab — primarily a flip foldable (arcfox / moto razr+) for odd-AR review.
# UxScreenshotTest drives the debug-only `--es screenshot <state>` hook and
# UiDevice.takeScreenshot()s each dense screen into the app's external files
# dir (/sdcard/Android/data/com.posterpdf/files/ux-shots — the /sdcard root is
# unwritable under scoped storage on API 30+), which FTL uploads to the results
# bucket via --directories-to-pull. Parent fetches gs://${FTL_BUCKET}/ux-shots-<run_id>/.../ux-shots/*.png.
#
# Manual-dispatch only: physical-device minutes consume FTL quota/cost.
# Auth: WIF (gh-actions-ci SA, testAdmin + storage.objectAdmin).

on:
  workflow_dispatch:
    inputs:
      device:
        # arcfox = moto razr+ flip (odd AR). For RELIABLE display-cutout / notch
        # coverage, dispatch with a punch-hole/notch model (e.g. a Pixel) — a real
        # device exposes a real DisplayCutout, far more reliable than the emulator
        # `cmd overlay enable …cutout.emulation.*` overlay, which crashes the AVD.
        description: 'FTL physical device model (arcfox=flip; a Pixel/notch model = real display-cutout coverage)'
        type: string
        default: 'arcfox'
      version:
        description: 'Android API level for the device'
        type: string
        default: '34'

permissions:
  contents: read
  id-token: write   # required for WIF

env:
  GCP_PROJECT: static-webbing-461904-c4
  FTL_BUCKET: ftl-results-static-webbing-461904-c4

jobs:
  ftl-ux-screenshots:
    name: UX screenshots on FTL (${{ inputs.device }} API ${{ inputs.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > release.keystore

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | base64 -d > app/google-services.json
          python3 -c 'import json; json.load(open("app/google-services.json"))' && echo "google-services.json: valid JSON"

      - name: Build debug APK + debug androidTest APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Debug build: the `--es screenshot <state>` hook is gated by
        # BuildConfig.ENABLE_TEST_HOOKS (true for debug), and UI screenshots
        # don't need the non-debuggable benchmark variant. App + test APK share
        # the debug cert + applicationId com.posterpdf.
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Locate APKs
        id: apks
        run: |
          APP_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          TEST_APK=$(find app/build/outputs/apk/androidTest/debug -name "*.apk" | head -1)
          if [ -z "$APP_APK" ] || [ -z "$TEST_APK" ]; then
            echo "Missing APK — app='$APP_APK' test='$TEST_APK'"; exit 1
          fi
          echo "app_apk=$APP_APK" >> "$GITHUB_OUTPUT"
          echo "test_apk=$TEST_APK" >> "$GITHUB_OUTPUT"
          echo "App: $APP_APK"; echo "Test: $TEST_APK"

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run UxScreenshotTest on Firebase Test Lab
        # SECURITY: device/version inputs are passed via env: and referenced as
        # shell vars (${DEVICE}/${VERSION}) — never interpolated into the script.
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
        run: |
          # pipefail so a crashed/failed device test correctly fails this job
          # (tee would otherwise mask gcloud's nonzero exit).
          set -eo pipefail
          gcloud firebase test android run \
            --type=instrumentation \
            --app="${{ steps.apks.outputs.app_apk }}" \
            --test="${{ steps.apks.outputs.test_apk }}" \
            --device="model=${DEVICE},version=${VERSION},locale=en,orientation=portrait" \
            --test-targets="class com.posterpdf.UxScreenshotTest" \
            --directories-to-pull=/sdcard/Android/data/com.posterpdf/files/ux-shots \
            --timeout=20m \
            --results-bucket="${FTL_BUCKET}" \
            --results-dir="ux-shots-${{ github.run_id }}" \
            --project="${GCP_PROJECT}" 2>&1 | tee /tmp/ftl.txt

      - name: Upload FTL log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftl-ux-screenshots-log
          # The PNGs land in the results bucket under ux-shots-<run_id> via
          # --directories-to-pull; the parent agent fetches them from there.
          path: |
            /tmp/ftl.txt
          retention-days: 30
          if-no-files-found: warn
