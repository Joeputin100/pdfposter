name: Screenshots (Emulator capture)

# RC69: deterministic UI screenshots captured on an emulator so the dev
# (and the AI agent) can visually verify Compose UI changes WITHOUT
# sideloading to a physical device. Mirrors the sister project
# (Not_This_Again)'s emulator approach, but uses a debug-only intent
# hook (MainActivity reads --es screenshot <state>) to deterministically
# open a named screen, then `adb exec-out screencap` captures it.
#
# Trigger: manual (workflow_dispatch) + on push to the redesign branch so
# every UI change auto-produces fresh screenshots as an artifact.

on:
  workflow_dispatch:
    inputs:
      store_mode:
        description: 'Capture Play-listing screenshots (1080x2340, story states only)'
        type: boolean
        default: false
  push:
    branches: ['feat/md3e-redesign']
    paths:
      - 'app/src/main/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

jobs:
  capture:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > release.keystore

      - name: Decode google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GS_B64" | base64 -d > app/google-services.json
          python3 -c 'import json; json.load(open("app/google-services.json"))' && echo "google-services.json: valid JSON"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-shots-api33-disk4g

      - name: Create AVD + warm cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD warmed"

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: STORE_MODE=${{ inputs.store_mode && '1' || '0' }} bash .github/scripts/capture-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/shots/
          retention-days: 14
          if-no-files-found: warn
